<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyPortfolio</title>
    <meta name="description" content="Personal portfolio tracker — investments, stocks, growth, and net worth." />
    <meta name="theme-color" content="#1a2332" />
    <script>
      try {
        const theme = localStorage.getItem('myportfolio-export-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=blue-arrow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyPortfolio" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
      }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png?v=blue-arrow" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
