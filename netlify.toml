[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/gold-rate"
  to = "/.netlify/functions/gold-rate"
  status = 200
  force = true

[[redirects]]
  from = "/api/psx-logo/:symbol"
  to = "/.netlify/functions/psx-logo?symbol=:symbol"
  status = 200
  force = true

[[redirects]]
  from = "/api/psx-quotes"
  to = "/.netlify/functions/psx-quotes"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never long-cache the service worker or manifest so PWA updates ship immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"
